<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CET-6 综合练习</title>
<style>
  :root {
    --bg: #17171c;
    --panel: #1e1e24;
    --text: #e6e6e9;
    --muted: #8a8a93;
    --accent: #6ea3c0;
    --accent-dim: #3d5a6e;
    --border: #2a2a32;
    --danger: #c07070;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
  }
  .wrap { max-width: 700px; margin: 0 auto; padding: 24px 20px 80px; }
  h1 { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 8px 16px; cursor: pointer; font-size: 14px; color: var(--muted);
    border-bottom: 2px solid transparent; user-select: none;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel { display: none; }
  .panel.active { display: block; }
  .btn {
    display: inline-block; padding: 9px 22px; border: 1px solid var(--accent-dim);
    background: transparent; color: var(--accent); font-size: 14px; cursor: pointer;
    border-radius: 4px; transition: background .12s;
  }
  .btn:hover { background: rgba(110,163,192,.08); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.small { padding: 5px 14px; font-size: 13px; }
  .btn.ghost { border-color: var(--border); color: var(--muted); }
  .btn.end { border-color: #5a3d3d; color: var(--danger); float: right; }
  #story-area {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 18px 20px; margin-bottom: 16px; min-height: 120px;
  }
  #story-area .placeholder { color: var(--muted); font-size: 13px; }
  .sent-row { margin-bottom: 8px; opacity: 0; animation: fadein .3s forwards; }
  .sent-row.playing .sent-text { color: var(--accent); }
  @keyframes fadein { to { opacity: 1; } }
  .sent-head { display: flex; align-items: baseline; gap: 8px; }
  .sent-text { flex: 1; }
  .speaker-tag {
    font-size: 11px; color: var(--accent); border: 1px solid var(--accent-dim);
    border-radius: 3px; padding: 0 5px; line-height: 1.4; flex: none;
  }
  .translate-btn {
    flex: none; border: 1px solid var(--border); background: transparent;
    color: var(--muted); font-size: 11px; line-height: 1.5; padding: 1px 8px;
    border-radius: 3px; cursor: pointer; transition: color .12s, border-color .12s;
  }
  .translate-btn:hover { color: var(--accent); border-color: var(--accent-dim); }
  .translate-btn:disabled { opacity: .4; cursor: default; }
  .translation {
    display: none; color: var(--muted); font-size: 13px; margin-top: 2px;
    padding-left: 2px; line-height: 1.6;
  }
  #options-area { margin-top: 14px; }
  .opt-btn {
    display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
    padding: 10px 14px; margin-bottom: 8px;
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    cursor: pointer; border-radius: 4px; font-size: 14px; line-height: 1.5;
  }
  .opt-btn:hover { border-color: var(--accent-dim); color: var(--accent); }
  .opt-btn .key { color: var(--accent); font-weight: 600; margin-right: 8px; }
  .opt-btn .opt-text { flex: 1; }
  .opt-btn .translate-btn { align-self: center; }
  #d-form { display: flex; gap: 8px; margin-top: 12px; }
  #d-input {
    flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px; border-radius: 4px; font-size: 14px; outline: none;
  }
  #d-input:focus { border-color: var(--accent-dim); }
  .status { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); margin-right: 6px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  #daily-result { margin-top: 16px; }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .meta b { color: var(--accent); font-weight: 600; }
  .audio-error { color: var(--danger); font-size: 13px; margin: 6px 0; }
  .daily-units { margin-top: 10px; }
  .trw-card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px; margin-bottom: 14px; }
  .trw-title { font-size: 14px; color: var(--text); line-height: 1.6; white-space: pre-wrap; }
  .trw-meta { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .trw-label { font-size: 12px; color: var(--muted); margin: 0 0 6px; display: block; }
  #wr-answer textarea, #tr-answer textarea {
    width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 10px 12px; font-size: 14px; min-height: 120px;
    outline: none; resize: vertical; font-family: inherit;
  }
  #wr-answer textarea:focus, #tr-answer textarea:focus { border-color: var(--accent-dim); }
  .trw-btns { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
  .tr-mode.active { border-color: var(--accent); color: var(--accent); }
  .tr-sent { margin-bottom: 10px; }
  .tr-sent .trw-title { font-size: 14px; }
  .tr-sent-input {
    width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 8px 10px; font-size: 14px; min-height: 64px;
    outline: none; resize: vertical; font-family: inherit; margin-top: 8px;
  }
  .tr-sent-input:focus { border-color: var(--accent-dim); }
  .grade-score { font-size: 20px; color: var(--accent); font-weight: 600; }
  .grade-tag { font-size: 12px; color: var(--muted); margin-left: 8px; }
  .grade-block { margin-top: 12px; }
  .grade-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .grade-para { border-left: 2px solid var(--accent-dim); padding-left: 10px; margin-bottom: 8px; font-size: 13px; }
  .grade-review { border-left: 2px solid var(--accent-dim); padding-left: 10px; margin-bottom: 8px; font-size: 13px; }
  .grade-sent { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .model-block { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; margin-top: 8px; white-space: pre-wrap; font-size: 13px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .model-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .model-label { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .model-btn {
    padding: 4px 12px; border: 1px solid var(--border); background: transparent;
    color: var(--muted); font-size: 13px; cursor: pointer; border-radius: 4px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .model-btn .dot { width: 6px; height: 6px; border-radius: 50%; background: #555; display: inline-block; }
  .model-btn .dot.on { background: var(--accent); }
  .model-btn.active { border-color: var(--accent); color: var(--accent); }
  .model-select {
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    font-size: 13px; padding: 4px 8px; border-radius: 4px; outline: none; max-width: 220px;
  }
  .model-select.active { border-color: var(--accent); color: var(--accent); }
  .key-input {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    font-size: 12px; padding: 4px 8px; border-radius: 4px; outline: none; width: 150px;
  }
  .key-input:focus { border-color: var(--accent-dim); }
  .key-input::placeholder { color: var(--muted); }
  .key-save { padding: 3px 10px; font-size: 12px; }
  .model-status { font-size: 12px; color: var(--muted); }
  .toggle-wrap { display: inline-flex; align-items: center; gap: 8px; }
  .toggle-label { font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle { position: relative; width: 36px; height: 20px; display: inline-block; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .track { position: absolute; inset: 0; background: var(--border); border-radius: 20px; transition: background .15s; pointer-events: none; }
  .toggle .thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: var(--muted); border-radius: 50%; transition: left .15s, background .15s; pointer-events: none; }
  .toggle input:checked + .track, .toggle.on .track { background: var(--accent-dim); }
  .toggle input:checked ~ .thumb, .toggle.on .thumb { left: 18px; background: var(--accent); }
  .hist-btn { padding: 3px 10px; font-size: 12px; }
  #hist-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
    align-items: flex-start; justify-content: center; z-index: 50;
  }
  #hist-overlay.show { display: flex; }
  .hist-drawer {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    width: min(560px, 92vw); max-height: 74vh; overflow-y: auto;
    margin-top: 10vh; padding: 16px 18px;
  }
  .hist-drawer h3 { font-size: 15px; color: var(--text); margin-bottom: 12px; }
  .hist-empty { color: var(--muted); font-size: 13px; }
  .hist-item { border: 1px solid var(--border); border-radius: 5px; padding: 10px 12px; margin-bottom: 8px; }
  .hist-item .hi-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hist-item .hi-title { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .hist-item .hi-date { font-size: 11px; color: var(--muted); flex: none; }
  .hist-item .hi-ops { display: flex; gap: 6px; margin-top: 8px; }
  .hist-item .hi-ops button { padding: 2px 10px; font-size: 12px; }
  .hist-restore { border: 1px solid var(--accent-dim); color: var(--accent); background: transparent; border-radius: 3px; cursor: pointer; }
  .hist-del { border: 1px solid #5a3d3d; color: var(--danger); background: transparent; border-radius: 3px; cursor: pointer; }
  .sp-word { padding: 1px 3px; border-radius: 3px; cursor: pointer; }
  .sp-word:hover { background: rgba(110,163,192,.10); }
  .sp-word.ok { color: var(--text); }
  .sp-word.bad { color: var(--danger); border-bottom: 2px solid var(--danger); }
  .sp-word.hl { background: rgba(110,163,192,.14); border-bottom: 1px solid var(--accent-dim); }
  .sp-word.read { color: var(--accent); }
  .sp-word.cur { background: rgba(110,163,192,.28); color: var(--accent); }
  .rec-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-right: 6px; animation: pulse 1s infinite; }
  .sp-sent { border-left: 2px solid var(--border); padding: 8px 0 8px 12px; margin-bottom: 10px; }
  .sp-sent-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sp-sent-text { flex: 1; min-width: 220px; line-height: 1.7; }
  .sp-sent .translation { display: none; color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.6; }
  .sp-sent-grade { margin-top: 8px; }
  .sp-mini-score { font-size: 16px; color: var(--accent); font-weight: 600; }
  .sp-record { font-size: 12px; padding: 4px 12px; flex: none; }
  .sp-record.recording { border-color: var(--danger); color: var(--danger); }
  .sp-replay:disabled { opacity: .4; cursor: default; }
  .translate-btn.playing { color: var(--accent); border-color: var(--accent); background: rgba(110,163,192,.12); }
  .sp-speed.active { color: var(--accent); border-color: var(--accent); background: rgba(110,163,192,.12); }
  .st-word { cursor: pointer; padding: 1px 2px; border-radius: 3px; }
  .st-word:hover { background: rgba(110,163,192,.14); }
  .st-word.read { color: var(--accent); }
  .word-bubble {
    position: fixed; z-index: 100; padding: 8px 10px;
    background: var(--panel); border: 1px solid var(--accent-dim); border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,.45); font-size: 13px; max-width: 240px;
  }
  .word-bubble .wb-trans { margin-bottom: 6px; line-height: 1.4; }
  .word-bubble .wb-actions { display: flex; gap: 6px; }
  .word-bubble .btn.small { padding: 3px 10px; font-size: 12px; }
  .nb-cat.active { border-color: var(--accent); color: var(--accent); }
  .nb-entry { margin-bottom: 10px; }
  .nb-word { font-size: 15px; }
  .nb-play { cursor: pointer; margin-left: 6px; }
  .nb-play:hover { color: var(--accent); }
  .nb-entry .hi-ops { display: flex; gap: 12px; margin-top: 10px; }
  .nb-edit-input {
    width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 4px; padding: 6px 8px; font-size: 13px; margin-top: 2px; margin-bottom: 8px;
    outline: none; font-family: inherit; resize: none; overflow: hidden; line-height: 1.6;
  }
  .nb-edit-input:focus { border-color: var(--accent-dim); }
  .wr-para { display: flex; align-items: flex-start; gap: 8px; }
  .wr-para > span { flex: 1; }
  .wr-collect { flex: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CET-6 综合练习</h1>
  <div class="sub">AI 生成 · Kokoro 朗读 · 每日一篇/互动故事/翻译/写作</div>
  <div class="tabs">
    <div class="tab active" data-panel="p-daily">每日一篇</div>
    <div class="tab" data-panel="p-story">互动故事</div>
    <div class="tab" data-panel="p-translation">翻译练习</div>
    <div class="tab" data-panel="p-writing">写作练习</div>
    <div class="tab" data-panel="p-speaking">口语练习</div>
    <div class="tab" data-panel="p-notebook">笔记本</div>
  </div>
  <div class="model-bar">
    <span class="model-label">生成模型</span>
    <button class="model-btn" data-profile="local"><span class="dot"></span>本地 Qwen</button>
    <button class="model-btn" data-profile="cloud" id="btn-cloud"><span class="dot"></span>云端 DeepSeek</button>
    <select id="cloud-model-select" class="model-select" title="选择云端模型"></select>
    <input type="password" id="ds-key" class="key-input" placeholder="DeepSeek API key">
    <button class="btn small ghost key-save" id="key-save">保存</button>
    <span class="model-status" id="model-status"></span>
  </div>

  <div class="panel" id="p-story">
    <div id="story-area"><div class="placeholder">点「开始新故事」，AI 讲一段，你来决定走向。</div></div>
    <div id="options-area"></div>
    <div class="status" id="story-status"></div>
    <div style="margin-top: 16px; display: flex; align-items: center; gap: 12px;">
      <button class="btn" id="btn-start">开始新故事</button>
      <button class="btn end" id="btn-end" style="display:none">存档结束</button>
      <span style="flex:1"></span>
      <button class="btn small ghost hist-btn" data-type="story">历史</button>
    </div>
  </div>

  <div class="panel active" id="p-daily">
    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="btn" id="btn-daily">生成今日一篇</button>
      <span style="flex:1"></span>
      <button class="btn small ghost hist-btn" data-type="daily">历史</button>
    </div>
    <div class="status" id="daily-status"></div>
    <div id="daily-result"></div>
  </div>

  <div class="panel" id="p-writing">
    <div id="wr-task" class="trw-card"><div class="placeholder">点「出一题」，AI 现场编作文题</div></div>
    <div id="wr-answer">
      <span class="trw-label">你的作文</span>
      <textarea id="wr-input" placeholder="在这里写你的作文（150-180 词）…"></textarea>
    </div>
    <div class="trw-btns">
      <button class="btn" id="wr-generate">出一题</button>
      <button class="btn" id="wr-submit" disabled>提交批改</button>
      <button class="btn small ghost" id="wr-new" disabled>换一题</button>
      <span style="flex:1"></span>
      <button class="btn small ghost hist-btn" data-type="writing">历史</button>
    </div>
    <div id="wr-grade"></div>
  </div>

  <div class="panel" id="p-translation">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
      <button class="btn small tr-mode active" id="tr-mode-whole">整段模式</button>
      <button class="btn small tr-mode" id="tr-mode-sentence">单句模式</button>
      <span style="flex:1"></span>
      <button class="btn small ghost hist-btn" data-type="translation">历史</button>
    </div>
    <div id="tr-task" class="trw-card"><div class="placeholder">点「出一题」，AI 现场编翻译材料</div></div>
    <div id="tr-whole-box">
      <div id="tr-answer">
        <span class="trw-label">你的译文</span>
        <textarea id="tr-input" placeholder="在这里写你的英文译文…"></textarea>
      </div>
      <div class="trw-btns">
        <button class="btn" id="tr-generate">出一题</button>
        <button class="btn" id="tr-submit" disabled>提交批改</button>
        <button class="btn small ghost" id="tr-new" disabled>换一题</button>
      </div>
      <div id="tr-grade"></div>
    </div>
    <div id="tr-sentence-box" style="display:none">
      <div id="tr-sent-list"></div>
      <div class="trw-btns">
        <button class="btn" id="tr-s-generate">出一题</button>
        <button class="btn small ghost" id="tr-s-new" disabled>换一题</button>
      </div>
    </div>
  </div>

  <div class="panel" id="p-speaking">
    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="btn" id="sp-generate">生成朗读题</button>
      <span style="flex:1"></span>
      <button class="btn small ghost hist-btn" data-type="speaking">历史</button>
    </div>
    <div class="status" id="sp-status"></div>
    <div id="sp-task" class="trw-card" style="display:none">
      <div class="trw-meta" id="sp-words-meta"></div>
      <div class="status" style="margin:6px 0 12px; display:flex; align-items:center; flex-wrap:wrap; gap:6px">
        <span>语速</span>
        <button class="translate-btn sp-speed" data-rate="0.5">0.5x</button>
        <button class="translate-btn sp-speed" data-rate="0.75">0.75x</button>
        <button class="translate-btn sp-speed active" data-rate="1">1x</button>
        <button class="translate-btn sp-speed" data-rate="1.25">1.25x</button>
        <button class="translate-btn sp-speed" data-rate="1.5">1.5x</button>
        <span style="margin-left:6px">逐句：播放范本（逐词变蓝）→ 开始朗读 → 停止并评分 → 回放 · 点击任意单词可单独听发音</span>
      </div>
      <div id="sp-sentences"></div>
    </div>
  </div>

  <div class="panel" id="p-notebook">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap">
      <button class="btn small nb-cat active" data-cat="words">生词</button>
      <button class="btn small nb-cat" data-cat="patterns">翻译句式</button>
      <button class="btn small nb-cat" data-cat="writing">写作表达</button>
      <span style="flex:1"></span>
      <button class="btn small ghost" id="nb-review">复习模式</button>
      <button class="btn small ghost" id="nb-export">导出</button>
    </div>
    <div id="nb-list"></div>
    <div id="nb-review-box" style="display:none"></div>
  </div>
</div>

<div id="hist-overlay">
  <div class="hist-drawer">
    <h3 id="hist-title">历史记录</h3>
    <div id="hist-list"><div class="hist-empty">空</div></div>
    <div style="margin-top:12px"><button class="btn small ghost" onclick="closeHistory()">关闭</button></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// LLM 请求统一带超时。后端单次 180s × 重试1（+5xx 重试）最坏约 360s+，
// 前端超时必须 ≥ 后端最坏时长，否则后端仍在跑、前端已 abort，导致重复生成/重复归档。
async function llmFetch(url, body, timeoutMs = 420000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    return await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctrl.signal,
    });
  } finally {
    clearTimeout(timer);
  }
}

// ---------- SSE 工具 ----------
function parseSSEBlock(block) {
  let event = 'message', dataLines = [];
  for (const line of block.split('\n')) {
    if (line.startsWith('event: ')) event = line.slice(7).trim();
    else if (line.startsWith('data: ')) dataLines.push(line.slice(6));
  }
  try { return { event, data: JSON.parse(dataLines.join('\n')) }; }
  catch { return { event, data: {} }; }
}

// 与 llmFetch 保持一致：后端 llm_stream 单次 180s + 重试最坏约 360s+，
// 前端超时须 ≥ 后端最坏时长，否则后端仍在生成、前端已 abort。
async function streamSSE(url, body, onEvent, timeoutMs = 420000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
      signal: ctrl.signal,
    });
    if (!resp.ok) {
      let detail = `HTTP ${resp.status}`;
      try { const j = await resp.json(); if (j && j.detail) detail = j.detail; } catch {}
      throw new Error(detail);
    }
    const sid = resp.headers.get('X-Session-Id');
    if (sid) onEvent('session', { session_id: sid });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) !== -1) {
          const block = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          if (block.trim()) onEvent(parseSSEBlock(block).event, parseSSEBlock(block).data);
        }
      }
    } catch (e) {
      // 流中断/超时：取消 reader，避免永久 busy；异常继续向上抛给调用方处理
      try { await reader.cancel(); } catch {}
      throw e;
    }
  } finally {
    clearTimeout(timer);
  }
}

// ---------- 音频顺序队列 ----------
let playChain = Promise.resolve();
let playEpoch = 0;
const activeAudios = new Set();
let activeFinish = null;  // 当前正在播放项的 finish，stopAllAudio 时立即结束，避免后续排队阻塞 30s
function stopAllAudio() {
  playEpoch++;  // 失效所有尚未播放的排队项（幽灵音频防护）
  for (const a of activeAudios) { try { a.pause(); } catch {} }
  activeAudios.clear();
  if (activeFinish) { const f = activeFinish; activeFinish = null; try { f(); } catch {} }
}
function enqueueAudio(b64, onPlay, onProgress) {
  const epoch = playEpoch;
  playChain = playChain.then(() => new Promise(resolve => {
    if (epoch !== playEpoch) { resolve(); return; }  // 已被 stopAllAudio 取消
    const blob = new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], { type: 'audio/wav' });
    const a = new Audio(URL.createObjectURL(blob));
    activeAudios.add(a);
    let settled = false;
    let timer = null;
    const finish = () => {
      if (settled) return;
      settled = true;
      if (timer) clearTimeout(timer);
      activeAudios.delete(a);
      URL.revokeObjectURL(a.src);
      activeFinish = null;
      resolve();
    };
    activeFinish = finish;
    a.onended = finish;
    a.onerror = finish;
    if (onProgress) a.ontimeupdate = () => onProgress(a.currentTime, a.duration);
    if (onPlay) onPlay();
    a.play().catch(finish);
    // 兜底：切后台/浏览器暂停导致 onended 不触发时，先停再推进队列，避免下一句叠在旧句上
    timer = setTimeout(() => { try { a.pause(); } catch {} finish(); }, 30000);
  }));
}

// ---------- 翻译（带缓存，逐句按需展开） ----------
const transCache = {};
async function toggleTranslation(text, btn) {
  const row = btn.closest('.sent-row');
  const tr = row.querySelector('.translation');
  if (tr.style.display === 'block') { tr.style.display = 'none'; return; }
  if (transCache[text]) {
    tr.textContent = transCache[text];
    tr.style.display = 'block';
    return;
  }
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const r = await llmFetch('/api/translate', { text });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    transCache[text] = d.translation;
    tr.textContent = d.translation;
    tr.style.display = 'block';
  } catch (e) {
    tr.textContent = '翻译失败，稍后再试';
    tr.style.display = 'block';
  }
  btn.disabled = false;
  btn.textContent = '译';
}

function makeSentenceRow(text, speaker, wordClick, wordSource) {
  const row = document.createElement('div');
  row.className = 'sent-row';
  const head = document.createElement('div');
  head.className = 'sent-head';
  if (speaker) {
    const tag = document.createElement('span');
    tag.className = 'speaker-tag';
    tag.textContent = speaker;
    head.appendChild(tag);
  }
  const txt = document.createElement('span');
  txt.className = 'sent-text';
  if (wordClick) {
    wbRenderWords(txt, text, wordSource || '');
  } else {
    txt.textContent = text;
  }
  head.appendChild(txt);
  const btn = document.createElement('button');
  btn.className = 'translate-btn';
  btn.textContent = '译';
  btn.title = '翻译';
  btn.onclick = () => toggleTranslation(text, btn);
  head.appendChild(btn);
  const tr = document.createElement('div');
  tr.className = 'translation';
  row.appendChild(head);
  row.appendChild(tr);
  return row;
}

// ---------- 逐词气泡：翻译（默认开启）+ 播放 + 收录（互动故事/每日一篇/参考译文/范文/笔记本通用） ----------
let wbBubbleEl = null, wbWord = null, wbContext = null, wbSource = '', wbAnchor = null;

function wbWordSpan(word, context, source) {
  const span = document.createElement('span');
  span.className = 'st-word';
  span.textContent = word;
  span.onclick = (e) => {
    e.stopPropagation();
    wbShowBubble(span, word, context, source);
  };
  return span;
}

// 把文本按词渲染进容器（英文单词可点，标点空格原样保留）
function wbRenderWords(container, text, source) {
  container.innerHTML = '';
  const tokens = String(text).split(/([\w']+)/);
  tokens.forEach(tok => {
    if (/^[\w']+$/.test(tok)) {
      container.appendChild(wbWordSpan(tok, text, source));
    } else {
      container.appendChild(document.createTextNode(tok));
    }
  });
}

function wbShowBubble(anchor, word, context, source) {
  wbHideBubble();
  wbWord = word;
  wbContext = context || '';
  wbSource = source || '';
  const b = document.createElement('div');
  b.className = 'word-bubble';
  b.innerHTML = '<div class="wb-trans">翻译中…</div><div class="wb-actions"></div>';
  const trans = b.querySelector('.wb-trans');
  const act = b.querySelector('.wb-actions');
  const play = document.createElement('button');
  play.className = 'btn small';
  play.textContent = '▶ 播放';
  play.onclick = (e) => { e.stopPropagation(); wbPlayWord(wbWord); };
  const add = document.createElement('button');
  add.className = 'btn small';
  add.textContent = '＋收录';
  add.onclick = async (e) => {
    e.stopPropagation();
    add.disabled = true;
    add.textContent = '收录中…';
    try {
      const r = await fetch('/api/notebook/word', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ word: wbWord, context: wbContext, source: wbSource }),
      });
      if (!r.ok) { const e2 = await r.json(); throw new Error(e2.detail || r.status); }
      const d = await r.json();
      add.textContent = d.duplicate ? '已收录过 ✓' : '已收录 ✓';
      add.disabled = false;
      setTimeout(wbHideBubble, 1200);
    } catch (err) {
      add.textContent = '收录失败';
      add.disabled = false;
      setTimeout(wbHideBubble, 1500);
    }
  };
  act.appendChild(play);
  act.appendChild(add);
  document.body.appendChild(b);
  wbBubbleEl = b;
  wbAnchor = anchor;
  wbReposition();
  wbFetchMeaning(trans, wbWord);
  setTimeout(() => document.addEventListener('click', wbHideBubble), 0);
  window.addEventListener('scroll', wbReposition, true);  // 滚动时气泡跟随单词
  window.addEventListener('resize', wbReposition);
}

function wbReposition() {
  if (wbBubbleEl && wbAnchor) {
    const r = wbAnchor.getBoundingClientRect();
    wbBubbleEl.style.left = Math.min(r.left, window.innerWidth - 220) + 'px';
    wbBubbleEl.style.top = (r.bottom + 4) + 'px';
  }
}

async function wbFetchMeaning(transEl, word) {
  try {
    const r = await llmFetch('/api/word/translate', { word });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    transEl.textContent = d.meaning || '（未查到）';
  } catch (e) {
    transEl.textContent = '翻译失败';
  }
}

function wbHideBubble() {
  if (wbBubbleEl) { wbBubbleEl.remove(); wbBubbleEl = null; }
  wbAnchor = null;
  document.removeEventListener('click', wbHideBubble);
  window.removeEventListener('scroll', wbReposition, true);
  window.removeEventListener('resize', wbReposition);
}

let sessionId = null, busy = false, lastSentEl = null;

function clearStoryUI() {
  stopAllAudio();
  $('story-area').innerHTML = '';
  $('options-area').innerHTML = '';
  lastSentEl = null;
  sessionId = null;  // 开始新故事前清空旧 sessionId，避免启动失败后误归档上一会话
}

function setStatus(html) { $('story-status').innerHTML = html; }
function clearStatus() { $('story-status').innerHTML = ''; }

function showOptions(options) {
  const box = $('options-area');
  box.innerHTML = '';
  const letters = ['A', 'B', 'C'];
  options.forEach((opt, k) => {
    box.appendChild(makeOptionRow(letters[k], opt));
  });
  const form = document.createElement('div');
  form.id = 'd-form';

    if (t) choose(t);
  };
  $('d-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { const t = $('d-input').value.trim(); if (t) choose(t); }

function choose(choice) {
  if (busy || !sessionId) return;
  busy = true;
  $('options-area').innerHTML = '';
  const tag = document.createElement('div');
  tag.className = 'meta';
  tag.textContent = `→ 你的选择：${choice.length > 60 ? choice.slice(0, 60) + '…' : choice}`;
  $('story-area').appendChild(tag);
  setStatus('<span class="dot"></span>正在续写并朗读…');
  streamSSE('/api/story/choose', { session_id: sessionId, choice }, handleStreamEvent)
    .catch(err => { setStatus(`出错了：${escapeHtml(err.message)}`); })
    .finally(() => { busy = false; });
}

function handleStreamEvent(ev, data) {
  if (ev === 'session') { sessionId = data.session_id; return; }
  if (ev === 'error') { setStatus(`出错了：${escapeHtml(data.message || '未知错误')}`); busy = false; return; }
  if (ev === 'sentence') {
    const el = makeSentenceRow(data.text, null, true, '互动故事');  // 互动故事正文：逐词可点（翻译/播放/收录）
    $('story-area').appendChild(el);
    el.scrollIntoView({ block: 'end', behavior: 'smooth' });
    const wordSpans = Array.from(el.querySelectorAll('.sent-text .st-word'));
    const wt = data.word_timeline || [];
    enqueueAudio(data.audio, null, (t) => {
      // 逐词变蓝：用 kokoro 词级时间戳精确对齐
      let wi = 0;
      for (let j = 0; j < wt.length; j++) {
        if (t >= wt[j].start) wi = j + 1; else break;
      }
      wi = Math.min(wi, wordSpans.length);
      wordSpans.forEach((s, i) => s.classList.toggle('read', i < wi));
    });
  }
  if (ev === 'options') { showOptions(data.options); busy = false; clearStatus(); }
  if (ev === 'done') { busy = false; }
}

$('btn-start').onclick = () => {
  if (busy) return;
  busy = true;
  clearStoryUI();
  $('btn-end').style.display = 'inline-block';
  setStatus('<span class="dot"></span>正在构思故事开头…');
  streamSSE('/api/story/start', {}, handleStreamEvent)
    .catch(err => { setStatus(`出错了：${escapeHtml(err.message)}`); })
    .finally(() => { busy = false; });
};

$('btn-end').onclick = async () => {
  if (!sessionId) return;
  const btn = $('btn-end');

    const r = await fetch('/api/story/end', {

};

// ---------- 每日一篇 ----------
function collectDailyWordSpans(unitRows) {
  return unitRows.map(row => Array.from(row.querySelectorAll('.sent-text .st-word')));
}

// 逐词高亮：优先用 kokoro 词级时间戳精确定位，缺省按字符长度加权估算
function highlightDailyWords(unitRows, wordSpansPerRow, timeline, wordTimeline, t, duration) {
  if (!unitRows.length) return;
  let cur = 0;
  if (timeline.length) {
    for (let i = 0; i < timeline.length; i++) {
      if (t >= timeline[i].start) cur = i; else break;
    }
  } else if (duration) {
    cur = Math.floor((t / duration) * unitRows.length);
  }
  unitRows.forEach((row, i) => {
    const spans = wordSpansPerRow[i] || [];
    if (i < cur) {
      spans.forEach(s => s.classList.add('read'));
    } else if (i === cur) {
      const wt = (wordTimeline && wordTimeline[cur]) || [];
      let wi;
      if (wt.length) {
        // 精确：按词级时间戳定位当前词
        wi = 0;
        for (let j = 0; j < wt.length; j++) {
          if (t >= wt[j].start) wi = j + 1; else break;
        }
        wi = Math.min(wi, spans.length);
      } else {
        // 兜底：按字符长度加权分配句内时间（长词读得更久）
        let within = 1;
        if (timeline.length && timeline[cur] && (timeline[cur].dur || 0) > 0) {
          within = (t - timeline[cur].start) / timeline[cur].dur;
        } else if (duration && unitRows.length) {
          const rowDur = duration / unitRows.length;
          within = (t - cur * rowDur) / rowDur;
        }
        within = Math.max(0, Math.min(1, within));
        const weights = spans.map(s => Math.max(1, s.textContent.length));
        const total = weights.reduce((a, b) => a + b, 0) || 1;
        const target = within * total;
        let acc = 0;
        wi = spans.length;
        for (let j = 0; j < weights.length; j++) {
          acc += weights[j];
          if (acc >= target) { wi = j + 1; break; }
        }
      }
      spans.forEach((s, j) => s.classList.toggle('read', j < wi));
    } else {
      spans.forEach(s => s.classList.remove('read'));
    }
  });
}

    });
    result.appendChild(unitsBox);

    const timeline = d.timeline || [];

    const wordSpansPerRow = collectDailyWordSpans(unitRows);
    audio.ontimeupdate = () => {

    audio.onended = () => { wordSpansPerRow.flat().forEach(s => s.classList.remove('read')); };
    $('daily-result').appendChild(result);
  } catch (e) {
    $('daily-status').innerHTML = `出错了：${escapeHtml(e.message)}`;

function renderModelStatus() {

  const parts = [];
  for (const [k, v] of Object.entries(modelState)) {
    if (k === 'active' || k === 'model' || k === 'cloud_models' || k === 'has_key') continue;

    parts.push(`${k === 'local' ? '本地' : '云端'}: ${v.online ? '在线' : '离线'}`);

// ---------- 翻译 / 写作（两个独立面板，通用逻辑） ----------
function initTrwPanel(prefix, type) {
  const taskEl = $(prefix + '-task');
  const inputEl = $(prefix + '-input');
  const gradeEl = $(prefix + '-grade');
  const submitBtn = $(prefix + '-submit');
  const newBtn = $(prefix + '-new');
  let task = null;
  let busy = false;

  function renderTask(t) {
    task = t;
    if (t.type === 'writing') {
      let html = `<div class="trw-title">${escapeHtml(t.title)}</div>`;
      if (t.image_desc) html += `<div class="trw-meta">【图/表】${escapeHtml(t.image_desc)}</div>`;
      if (t.requirements) html += `<div class="trw-meta">【要求】${escapeHtml(t.requirements)}</div>`;
      taskEl.innerHTML = html;
    } else {
      taskEl.innerHTML = `<div class="trw-title">【汉译英】将下面中文段落译成英语</div><div class="trw-meta">${escapeHtml(t.material)}</div>`;
    }
    inputEl.value = '';
    inputEl.placeholder = t.type === 'writing' ? '在这里写你的作文（150-180 词）…' : '在这里写你的英文译文…';
    gradeEl.innerHTML = '';
    submitBtn.disabled = false;
    newBtn.disabled = false;
  }

  async function gen() {
    if (busy) return;
    busy = true;
    taskEl.innerHTML = '<div class="status"><span class="dot"></span>正在出一题…</div>';
    inputEl.value = '';
    gradeEl.innerHTML = '';
    submitBtn.disabled = true;
    newBtn.disabled = true;
    try {
      const r = await llmFetch('/api/trw/generate', { type });
      if (!r.ok) { const e = await r.json(); throw new Error(e.detail || r.status); }
      task = await r.json();
      renderTask(task);
    } catch (e) {
      taskEl.innerHTML = `<div class="placeholder">出题失败：${escapeHtml(e.message)}</div>`;
    }
    busy = false;
  }

  async function submit() {
    const answer = inputEl.value.trim();
    if (!answer) { gradeEl.innerHTML = '<div class="placeholder">请先写下你的答案</div>'; return; }
    submitBtn.disabled = true;
    gradeEl.innerHTML = '<div class="status"><span class="dot"></span>AI 正在批改…</div>';
    try {
      const r = await llmFetch('/api/trw/grade', { type, task, answer });
      if (!r.ok) { const e = await r.json(); throw new Error(e.detail || r.status); }
      renderGrade(await r.json());
    } catch (e) {
      gradeEl.innerHTML = `<div class="placeholder">批改失败：${escapeHtml(e.message)}</div>`;
      submitBtn.disabled = false;
    }
  }

  function renderGrade(d) {
    if (d.type === 'writing') {
      let html = `<div class="grade-block"><span class="grade-score">${escapeHtml(d.score)}</span><span class="grade-tag">/15 · ${escapeHtml(d.tier || '')}</span></div>`;
      if (d.paras && d.paras.length) {
        html += `<div class="grade-block"><div class="grade-label">逐段批注</div>`;
        d.paras.forEach(p => { html += `<div class="grade-para"><b>${escapeHtml(p.para || '')}</b>：${escapeHtml(p.comment || '')}</div>`; });
        html += '</div>';
      }
      if (d.model) {
        html += `<div class="grade-block"><div class="grade-label">同题范文（每段可「收录」，点单词查/播/收）</div></div>`;
      }
      gradeEl.innerHTML = html;
      if (d.model) {
        // 范文按段渲染，段内逐词可点
        const box = gradeEl.querySelectorAll('.grade-block');
        const modelBox = box[box.length - 1];
        const paras = String(d.model).split(/\n+/).map(s => s.trim()).filter(s => s);
        paras.forEach((para, pi) => {
          const p = document.createElement('div');
          p.className = 'model-block wr-para';
          const span = document.createElement('span');
          wbRenderWords(span, para, '写作练习');
          p.appendChild(span);
          const btn = document.createElement('button');
          btn.className = 'btn small ghost wr-collect';
          btn.textContent = '收录';
          btn.onclick = async () => {
            btn.disabled = true; btn.textContent = '收录中…';
            try {
              const r = await fetch('/api/notebook/writing', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: para }),
              });
              if (!r.ok) throw new Error(r.status);
              const dd = await r.json();
              btn.textContent = dd.duplicate ? '已收录过 ✓' : '已收录 ✓';
              btn.disabled = false;
            } catch (e) {
              btn.textContent = '收录失败';
              btn.disabled = false;
            }
          };
          p.appendChild(btn);
          modelBox.appendChild(p);
        });
      }
      submitBtn.disabled = false;
    } else {
      let html = `<div class="grade-block"><span class="grade-score">${escapeHtml(d.score)}</span><span class="grade-tag">/15 · ${escapeHtml(d.tier || '')}</span></div>`;
      if (d.reference) html += `<div class="grade-block"><div class="grade-label">参考译文</div><div class="model-block">${escapeHtml(d.reference)}</div></div>`;
      if (d.reviews && d.reviews.length) {
        html += `<div class="grade-block"><div class="grade-label">逐句点评</div>`;
        d.reviews.forEach(x => { html += `<div class="grade-review">${escapeHtml(x.comment || '')}<div class="grade-sent">考生：${escapeHtml(x.sentence || '')} ｜ 参考：${escapeHtml(x.reference || '')}</div></div>`; });
        html += '</div>';
      }
      gradeEl.innerHTML = html;
      submitBtn.disabled = false;
    }
  }

  $(prefix + '-generate').onclick = gen;
  $(prefix + '-submit').onclick = submit;
  $(prefix + '-new').onclick = gen;

  // 暴露给历史恢复使用：恢复写作题时同步设置闭包 task 并启用提交
  return {
    renderTask,
    renderGrade,
    setAnswer(v) { inputEl.value = v; },
  };
}

// ---------- 口语练习 ----------
let spExerciseId = null, spSentences = [], spTargetSet = new Set();
let spStream = null, spRecorder = null, spChunks = [], spTimer = null, spSeconds = 0;
let spRecIndex = null, spActiveAudio = null, spActiveBtn = null, spActiveOnEnd = null, spBusy = false;
let spRecordEpoch = 0;  // 录音启动令牌：每次 spStopRecord 自增，失效在途的 getUserMedia
let spSpeed = 1.0, spActiveWordAudio = null, spActiveWordSpan = null;

function spStatus(html) { $('sp-status').innerHTML = html; }
function spClearStatus() { $('sp-status').innerHTML = ''; }

window.addEventListener('error', function (e) {
  if (e.target && (e.target.tagName === 'AUDIO' || e.target.tagName === 'IMG')) return;
  console.error('[前端错误]', e.message, 'at', e.filename, e.lineno + ':' + e.colno);
});
window.addEventListener('unhandledrejection', function (e) {
  console.error('[未处理的Promise拒绝]', e.reason);
});

function spSetRecordButtonsDisabled(disabled) {
  document.querySelectorAll('.sp-record').forEach(b => { b.disabled = disabled; });
}

// 把文本拆成词节点（逐词着色 / 高亮织入词 / 点击单词单独播放）
function spWordNodes(text, scoredWords) {
  const tokens = String(text).split(/([\w']+)/);
  const nodes = [];
  let wi = 0;
  tokens.forEach(tok => {
    if (/^[\w']+$/.test(tok)) {
      const span = document.createElement('span');
      span.className = 'sp-word';
      span.textContent = tok;
      const info = scoredWords ? scoredWords[wi] : null;
      if (info) {
        span.classList.add(info.ok ? 'ok' : 'bad');
        span.title = info.ok ? '点击查翻译/播放/收录' : '发音待改进 · 点击查翻译/播放/收录';
        wi++;
      } else {
        span.title = '点击查翻译/播放/收录';
        if (spTargetSet.has(tok.toLowerCase())) {
          span.classList.add('hl');
        }
      }
      span.onclick = () => wbShowBubble(span, tok, text, '口语练习');
      nodes.push(span);
    } else {
      nodes.push(document.createTextNode(tok));
    }
  });
  return nodes;
}

// 点击单词：单独朗读该词（Kokoro 合成，带缓存）
function spPlayWord(text, span) {
  spStopPlayback();
  if (spActiveWordAudio) { try { spActiveWordAudio.pause(); } catch (e) {} spActiveWordAudio = null; }
  if (spActiveWordSpan) { spActiveWordSpan.classList.remove('cur'); spActiveWordSpan = null; }
  const a = new Audio('/api/tts/word?text=' + encodeURIComponent(text) + '&_=' + Date.now());
  a.playbackRate = spSpeed;
  spActiveWordAudio = a;
  spActiveWordSpan = span;
  span.classList.add('cur');
  a.onended = () => { spActiveWordAudio = null; span.classList.remove('cur'); spActiveWordSpan = null; };
  a.onerror = () => { spActiveWordAudio = null; span.classList.remove('cur'); spActiveWordSpan = null; };
  a.play().catch(() => {});
}

function spRenderErrors(errors) {
  if (!errors || !errors.length) return '';
  let html = '<div class="grade-block"><div class="grade-label">发音问题</div>';
  errors.forEach(e => {
    html += '<div class="grade-review"><b>' + escapeHtml(e.word) + '</b>：' +
      escapeHtml(e.expected) + ' → ' + escapeHtml(e.actual);
    if (e.confidence != null) html += '（置信度 ' + Math.round(e.confidence * 100) + '%）';
    const badPhones = (e.phones || []).filter(p => p.expected !== p.heard);
    if (badPhones.length) {
      html += '<div class="grade-sent">' +
        badPhones.map(p => escapeHtml(p.expected) + ' → ' + escapeHtml(p.heard)).join('；') +
        '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function spStopRecord() {
  spStopPlayback();  // 开始录音/生成新题时停掉正在播放的音频，避免麦克风回授
  spRecordEpoch++;   // 失效所有在途 getUserMedia，防止双击竞态导致录音互相覆盖
  if (spTimer) { clearInterval(spTimer); spTimer = null; }
  if (spStream) { spStream.getTracks().forEach(t => t.stop()); spStream = null; }
  if (spRecorder) {
    spRecorder.onstop = null;  // 关键：中止录音时不得触发评分回调
    if (spRecorder.state !== 'inactive') { try { spRecorder.stop(); } catch (e) {} }
    spRecorder = null;
  }
  spChunks = [];
  spRecIndex = null;
  document.querySelectorAll('.sp-record').forEach(b => { b.textContent = '开始朗读'; b.classList.remove('recording'); });
}

function spSetPlayBtn(btn, playing) {
  if (!btn) return;
  if (playing) {
    if (!btn.dataset.origText) btn.dataset.origText = btn.textContent;
    btn.textContent = btn.classList.contains('sp-replay') ? '回放中…' : '播放中…';
    btn.classList.add('playing');
  } else {
    if (btn.dataset.origText) btn.textContent = btn.dataset.origText;
    btn.classList.remove('playing');
  }
}

function spStopPlayback() {
  if (spActiveAudio) { try { spActiveAudio.pause(); } catch (e) {} spActiveAudio = null; }
  if (spActiveBtn) { spSetPlayBtn(spActiveBtn, false); spActiveBtn = null; }
  if (spActiveOnEnd) { try { spActiveOnEnd(); } catch (e) {} spActiveOnEnd = null; }
  // 也停掉「单词单独播放」，否则点单词发音后立刻开始朗读会把扬声器声音录进麦克风
  if (spActiveWordAudio) { try { spActiveWordAudio.pause(); } catch (e) {} spActiveWordAudio = null; }
  if (spActiveWordSpan) { spActiveWordSpan.classList.remove('cur'); spActiveWordSpan = null; }
}

// opts.onProgress(0..1)：播放进度回调（用于逐词/逐句高亮）；opts.onEnd：结束时清理
function spPlayAudio(url, btn, opts) {
  opts = opts || {};
  console.log('[口语] 播放音频：', url);
  // 点击同一个正在播放的按钮 → 停止播放
  if (spActiveBtn === btn && spActiveAudio && !spActiveAudio.paused) {
    spStopPlayback();
    return;
  }
  spStopPlayback();
  const a = new Audio(url);
  a.playbackRate = spSpeed;  // 范本/回放跟随语速选择
  spActiveAudio = a;
  spActiveBtn = btn;
  spActiveOnEnd = opts.onEnd || null;
  spSetPlayBtn(btn, true);
  a.ontimeupdate = () => {
    if (opts.onProgress && a.duration) opts.onProgress(a.currentTime, a.duration);
  };
  a.onended = () => { spActiveAudio = null; spSetPlayBtn(btn, false); spActiveBtn = null; if (opts.onEnd) opts.onEnd(); spActiveOnEnd = null; };
  a.onerror = () => { spActiveAudio = null; spSetPlayBtn(btn, false); spActiveBtn = null; if (opts.onEnd) opts.onEnd(); spActiveOnEnd = null; console.error('[口语] 音频加载失败：', url); spStatus('音频加载失败，请重试'); };
  a.play().catch(err => {
    spActiveAudio = null; spSetPlayBtn(btn, false); spActiveBtn = null; if (opts.onEnd) opts.onEnd(); spActiveOnEnd = null;
    console.error('[口语] 播放被拒绝：', err);
    spStatus('播放失败：' + escapeHtml(err && err.message ? err.message : '未知错误'));
  });
}

// 播放范本：逐词变蓝（用 kokoro 词级时间戳精确对齐）
function spPlayRef(index) {
  const row = document.querySelector('.sp-sent[data-index="' + index + '"]');
  const btn = row ? row.querySelector('.sp-play-ref') : null;
  const wordSpans = row ? Array.from(row.querySelectorAll('.sp-sent-text .sp-word')) : [];
  const wt = (spSentences[index] && spSentences[index].word_timeline) || [];
  spPlayAudio('/api/speaking/audio?id=' + spExerciseId + '&kind=ref&i=' + index, btn, {
    onProgress: (t, dur) => {
      if (wt.length) {
        // 精确：按词级时间戳定位当前词
        let wi = 0;
        for (let j = 0; j < wt.length; j++) {
          if (t >= wt[j].start) wi = j + 1; else break;
        }
        wi = Math.min(wi, wordSpans.length);
        wordSpans.forEach((s, i) => s.classList.toggle('read', i < wi));
      } else {
        // 兜底：比例估算
        const wi = Math.floor((t / dur) * wordSpans.length);
        wordSpans.forEach((s, i) => s.classList.toggle('read', i < wi));
      }
    },
    onEnd: () => { wordSpans.forEach(s => s.classList.remove('read')); },
  });
}

async function spToggleTranslation(text, btn) {
  const row = btn.closest('.sp-sent');
  const tr = row.querySelector('.translation');
  if (tr.style.display === 'block') { tr.style.display = 'none'; return; }
  if (transCache[text]) { tr.textContent = transCache[text]; tr.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = '…';
  try {
    const r = await llmFetch('/api/translate', { text });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    transCache[text] = d.translation;
    tr.textContent = d.translation; tr.style.display = 'block';
  } catch (e) {
    tr.textContent = '翻译失败，稍后再试'; tr.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = '译';
}

function spToggleRecord(index) {
  if (spBusy) { spStatus('正在评分，请稍候…'); return; }
  if (spRecIndex === index && spRecorder && spRecorder.state === 'recording') {
    // 停止并评分：锁定录音按钮，评分期间禁止再次录音
    spBusy = true;
    spSetRecordButtonsDisabled(true);
    const rb = document.querySelector('.sp-sent[data-index="' + index + '"] .sp-record');
    if (rb) { rb.textContent = '评分中…'; }
    spRecorder.stop();
    return;
  }
  spStopRecord();
  spRecIndex = index;
  const epoch = spRecordEpoch;
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    if (spBusy || epoch !== spRecordEpoch) { stream.getTracks().forEach(t => t.stop()); return; }  // 兜底：评分期间/新一次录音已开始则不录音
    spStream = stream;
    spRecorder = new MediaRecorder(stream);
    spChunks = [];
    spRecorder.ondataavailable = e => { if (e.data && e.data.size) spChunks.push(e.data); };
    spRecorder.onstop = () => spOnRecordStop(index);
    spRecorder.start();
    const rb = document.querySelector('.sp-sent[data-index="' + index + '"] .sp-record');
    if (rb) { rb.textContent = '停止并评分'; rb.classList.add('recording'); }
    spSeconds = 0;
    spStatus('<span class="rec-dot"></span>正在朗读第 ' + (index + 1) + ' 句…');
    spTimer = setInterval(() => {
      spSeconds++;
      if (spSeconds >= 30) spRecorder.stop();
    }, 1000);
  }).catch(() => spStatus('无法访问麦克风：请允许权限并确认已连接麦克风'));
}

async function spOnRecordStop(index) {
  if (spTimer) { clearInterval(spTimer); spTimer = null; }
  if (spStream) { spStream.getTracks().forEach(t => t.stop()); spStream = null; }
  const rb = document.querySelector('.sp-sent[data-index="' + index + '"] .sp-record');
  if (rb) { rb.textContent = '开始朗读'; rb.classList.remove('recording'); }
  // 立即捕获本地快照，避免随后用户操作或新录音改写全局状态
  const mime = spRecorder ? (spRecorder.mimeType || 'audio/webm') : 'audio/webm';
  const chunks = spChunks;
  spChunks = [];
  spRecIndex = null;
  spRecorder = null;
  if (!chunks.length) {
    spBusy = false;
    spSetRecordButtonsDisabled(false);
    spClearStatus(); spStatus('未录到声音，请重试');
    return;
  }
  const blob = new Blob(chunks, { type: mime });
  if (blob.size < 1500) {  // 录音过短（约 <0.1s），视为未录到有效声音
    spBusy = false;
    spSetRecordButtonsDisabled(false);
    spClearStatus(); spStatus('录音过短，请靠近麦克风重新朗读');
    return;
  }
  const sentence = (spSentences || []).find(s => s.index === index);
  if (!sentence) { spBusy = false; spSetRecordButtonsDisabled(false); return; }
  $('sp-status').innerHTML = '<span class="dot"></span>正在评分第 ' + (index + 1) + ' 句…';
  console.log('[口语] 开始评分：', index, 'blob=', blob.size, 'bytes', 'mime=', mime);
  try {
    const b64 = await new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1]);
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 120000);  // 120s 超时，防挂死
    const r = await fetch('/api/speaking/assess', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ exercise_id: spExerciseId, audio: b64, audio_mime: mime, text: sentence.text, sentence_index: index }),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    if (!r.ok) { const e = await r.json(); throw new Error(e.detail || r.status); }
    const d = await r.json();
    console.log('[口语] 评分完成：', index, 'overall=', d.overall);
    spClearStatus();
    spRenderSentenceScore(index, d);
  } catch (e) {
    console.error('[口语] 评分失败：', e);
    spClearStatus();
    spStatus('评分失败：' + escapeHtml(e.message || e));
  } finally {
    spBusy = false;
    spSetRecordButtonsDisabled(false);
  }
}

function spRenderSentenceScore(index, d) {
  const row = document.querySelector('.sp-sent[data-index="' + index + '"]');
  if (!row) return;
  const sentence = (spSentences || []).find(s => s.index === index);
  if (sentence) {
    const txt = row.querySelector('.sp-sent-text');
    txt.innerHTML = '';
    spWordNodes(sentence.text, d.words).forEach(n => txt.appendChild(n));
  }
  const yb = row.querySelector('.sp-replay');
  if (yb) yb.disabled = false;
  const grade = row.querySelector('.sp-sent-grade');
  let html = '<div class="grade-block"><span class="sp-mini-score">' + escapeHtml(d.overall) +
    '</span><span class="grade-tag">/100 · ' + escapeHtml(d.band || '') + '</span></div>';
  if (d.transcribe) html += '<div class="grade-sent">系统听到：' + escapeHtml(d.transcribe) + '</div>';
  html += spRenderErrors(d.errors);
  if (d.hint) html += '<div class="grade-sent">' + escapeHtml(d.hint) + '</div>';
  grade.innerHTML = html;
}

// ---------- 笔记本 ----------
let nbData = { words: [], patterns: [], writing: [] };
let nbCat = 'words';
let nbReviewMode = false, nbReviewIdx = 0, nbReviewList = [];

async function nbLoad() {
  try {
    const r = await fetch('/api/notebook');
    if (r.ok) nbData = await r.json();
    else nbData = { words: [], patterns: [], writing: [] };
  } catch (e) {
    nbData = { words: [], patterns: [], writing: [] };
  }
  nbRender();
}

function nbRender() {
  if (nbReviewMode) { nbRenderReview(); return; }
  const list = nbData[nbCat] || [];
  const box = $('nb-list');
  if (!list.length) {
    box.innerHTML = '<div class="hist-empty">还没有收录内容</div>';
    return;
  }
  box.innerHTML = '';
  [...list].reverse().forEach(entry => box.appendChild(nbMakeEntry(entry)));
}

function nbPlay(text) {
  const a = new Audio('/api/tts/word?text=' + encodeURIComponent(String(text).slice(0, 400)) + '&_=' + Date.now());
  a.play().catch(() => {});
}

function nbMakeEntry(entry) {
  const row = document.createElement('div');
  row.className = 'trw-card nb-entry';
  row.dataset.nbId = entry.id;
  if (nbCat === 'words') {
    // 生词：单词可点（气泡），保留 🔊 朗读
    const head = document.createElement('div');
    head.className = 'nb-word';
    const b = document.createElement('b');
    wbRenderWords(b, entry.word, '笔记本');
    head.appendChild(b);
    const play = document.createElement('span');
    play.className = 'nb-play'; play.title = '播放'; play.textContent = '🔊';
    play.onclick = () => nbPlay(entry.word);
    head.appendChild(play);
    row.appendChild(head);
    const m = document.createElement('div');
    m.className = 'grade-sent'; m.textContent = entry.meaning || '';
    row.appendChild(m);
    if (entry.context) {
      const c = document.createElement('div');
      c.className = 'grade-sent';
      c.appendChild(document.createTextNode('例：'));
      wbRenderWords(c, entry.context, '笔记本');
      row.appendChild(c);
    }
    const d = document.createElement('div');
    d.className = 'hi-date'; d.textContent = (entry.date || '') + ' · ' + (entry.source || '');
    row.appendChild(d);
  } else if (nbCat === 'patterns') {
    // 翻译句式：英文逐词可点，无 🔊
    const zh = document.createElement('div');
    zh.className = 'trw-title'; zh.textContent = entry.zh || '';
    row.appendChild(zh);
    const en = document.createElement('div');
    en.className = 'model-block'; en.style.marginTop = '6px';
    wbRenderWords(en, entry.en || '', '笔记本');
    row.appendChild(en);
    if (entry.explain) {
      const ex = document.createElement('div');
      ex.className = 'grade-sent'; ex.textContent = '解读：' + (entry.explain || '');
      row.appendChild(ex);
    }
    const d = document.createElement('div');
    d.className = 'hi-date'; d.textContent = (entry.date || '') + ' · ' + (entry.source || '');
    row.appendChild(d);
  } else {
    // 写作表达：逐词可点，无 🔊
    const txt = document.createElement('div');
    txt.className = 'model-block';
    wbRenderWords(txt, entry.text || '', '笔记本');
    row.appendChild(txt);
    const d = document.createElement('div');
    d.className = 'hi-date'; d.textContent = (entry.date || '') + ' · ' + (entry.source || '');
    row.appendChild(d);
  }
  const ops = document.createElement('div');
  ops.className = 'hi-ops nb-ops';
  const editBtn = document.createElement('button');
  editBtn.className = 'hist-restore'; editBtn.textContent = '编辑';
  editBtn.onclick = () => nbEdit(entry, row);
  const delBtn = document.createElement('button');
  delBtn.className = 'hist-del'; delBtn.textContent = '删除';
  delBtn.onclick = () => nbDelete(entry.id);
  ops.appendChild(editBtn); ops.appendChild(delBtn);
  row.appendChild(ops);
  return row;
}

function nbEdit(entry, row) {
  let fields;
  if (nbCat === 'words') {
    fields = [['word', '单词'], ['meaning', '释义'], ['context', '例句']];
  } else if (nbCat === 'patterns') {
    fields = [['zh', '中文'], ['en', '英文'], ['explain', '解读']];
  } else {
    fields = [['text', '内容']];
  }
  row.innerHTML = fields.map(([, label]) =>
    '<div class="trw-label">' + label + '</div><textarea class="nb-edit-input"></textarea>').join('');
  const inputs = row.querySelectorAll('.nb-edit-input');
  const autoGrow = (el) => {
    el.style.height = 'auto';
    el.style.height = Math.max(48, el.scrollHeight) + 'px';
  };
  fields.forEach(([k], i) => {
    inputs[i].value = entry[k] || '';
    autoGrow(inputs[i]);
    inputs[i].addEventListener('input', () => autoGrow(inputs[i]));
  });
  const ops = document.createElement('div');
  ops.className = 'hi-ops';
  const save = document.createElement('button');
  save.className = 'hist-restore'; save.textContent = '保存';
  save.onclick = async () => {
    const updated = {};
    fields.forEach(([k], i) => { updated[k] = inputs[i].value.trim(); });
    try {
      const r = await fetch('/api/notebook/update', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ category: nbCat, id: entry.id, entry: updated }),
      });
      if (!r.ok) throw new Error(r.status);
      await nbLoad();
    } catch (e) {
      alert('保存失败：' + e.message);
    }
  };
  const cancel = document.createElement('button');
  cancel.className = 'hist-del'; cancel.textContent = '取消';
  cancel.onclick = () => nbRender();
  ops.appendChild(save); ops.appendChild(cancel);
  row.appendChild(ops);
}

async function nbDelete(id) {
  try {
    await fetch('/api/notebook?category=' + nbCat + '&id=' + id, { method: 'DELETE' });
    await nbLoad();
  } catch (e) {
    alert('删除失败：' + e.message);
  }
}

    play.onclick = () => nbPlay(e.word);
    wd.appendChild(play);
    card.appendChild(wd);
    const ans = document.createElement('div');
    ans.id = 'nb-review-ans'; ans.className = 'grade-sent';
    ans.style.display = 'none'; ans.style.marginTop = '12px';

    if (e.context) {
      ans.appendChild(document.createElement('br'));

      wbRenderWords(cc, e.context, '笔记本');
      ans.appendChild(cc);
    }
    card.appendChild(ans);
  } else if (nbCat === 'patterns') {
    const zh = document.createElement('div');
    zh.style.fontSize = '16px'; zh.textContent = e.zh || '';
    card.appendChild(zh);
    const ans = document.createElement('div');
    ans.id = 'nb-review-ans'; ans.className = 'model-block';
    ans.style.display = 'none'; ans.style.marginTop = '12px'; ans.style.textAlign = 'left';
    wbRenderWords(ans, e.en || '', '笔记本');

      ans.appendChild(ex);

    btn.className = 'btn small'; btn.id = 'nb-review-flip'; btn.textContent = '看答案';

  box.appendChild(card);
  const nav = document.createElement('div');
  nav.className = 'trw-btns'; nav.style.justifyContent = 'center';
  nav.innerHTML = '<button class="btn small" id="nb-prev">上一张</button>' +
    '<span class="status">' + (nbReviewIdx + 1) + ' / ' + nbReviewList.length + '</span>' +
    '<button class="btn small" id="nb-next">下一张</button>' +
    '<span style="flex:1"></span>' +
    '<button class="btn small ghost" id="nb-exit-review">退出复习</button>';
  box.appendChild(nav);
  $('nb-prev').onclick = () => { if (nbReviewIdx > 0) { nbReviewIdx--; nbRenderReview(); } };
  $('nb-next').onclick = () => { if (nbReviewIdx < nbReviewList.length - 1) { nbReviewIdx++; nbRenderReview(); } };
  $('nb-exit-review').onclick = () => {
    nbReviewMode = false;
    $('nb-review-box').style.display = 'none';
    $('nb-list').style.display = 'block';
    nbRender();
  };
}

$('nb-export').onclick = () => {
  const list = nbData[nbCat] || [];
  if (!list.length) return;
  const labels = { words: '生词', patterns: '翻译句式', writing: '写作表达' };
  let txt = '===== 笔记本 · ' + labels[nbCat] + ' =====\n\n';
  [...list].reverse().forEach(e => {
    if (nbCat === 'words') {
      txt += e.word + '  ' + (e.meaning || '') + '\n' + (e.context ? '  例: ' + e.context + '\n' : '') + '\n';
    } else if (nbCat === 'patterns') {
      txt += e.zh + '\n' + e.en + '\n' + (e.explain ? '  解读: ' + e.explain + '\n' : '') + '\n';
    } else {
      txt += e.text + '\n\n';
    }
  });
  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '笔记本_' + labels[nbCat] + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
};

// ---------- 历史归档：列表 / 恢复 / 删除 ----------
let histType = 'daily';

function openHistory(type) {
  histType = type;
  const labels = { daily: '每日一篇', story: '互动故事', writing: '写作', translation: '翻译', speaking: '口语练习' };
  $('hist-title').textContent = labels[type] + ' · 历史记录';
  $('hist-overlay').classList.add('show');
  loadHistoryList();
}

function closeHistory() {
  $('hist-overlay').classList.remove('show');
}

async function loadHistoryList() {
  const list = $('hist-list');
  try {
    const r = await fetch(`/api/history?type=${histType}`);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (!d.items.length) { list.innerHTML = '<div class="hist-empty">还没有历史记录</div>'; return; }
    list.innerHTML = '';
    d.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'hist-item';
      row.innerHTML = `<div class="hi-head"><span class="hi-title">${escapeHtml(item.title || item.id)}</span><span class="hi-date">${escapeHtml(item.date || '')}</span></div>
        <div class="hi-ops"><button class="hist-restore">恢复</button><button class="hist-del">删除</button></div>`;
      row.querySelector('.hist-restore').onclick = () => restoreHistory(item.id);
      row.querySelector('.hist-del').onclick = () => deleteHistory(item.id);
      list.appendChild(row);
    });
  } catch (e) {
    list.innerHTML = `<div class="hist-empty">加载失败：${escapeHtml(e.message)}</div>`;
  }
}

async function deleteHistory(id) {
  try {
    await fetch(`/api/history?id=${id}`, { method: 'DELETE' });
    loadHistoryList();
  } catch (e) {
    alert('删除失败：' + e.message);
  }
}

async function restoreHistory(id) {
  try {
    const r = await fetch(`/api/history/item?id=${id}`);
    if (!r.ok) throw new Error(r.status);
    const item = await r.json();
    closeHistory();
    switchTabForType(item.type);
    renderRestored(item);
  } catch (e) {
    alert('恢复失败：' + e.message);
  }
}

function switchTabForType(type) {
  const panelId = { daily: 'p-daily', story: 'p-story', writing: 'p-writing', translation: 'p-translation', speaking: 'p-speaking' }[type];
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  const tab = document.querySelector(`.tab[data-panel="${panelId}"]`);
  if (tab) tab.classList.add('active');
  $(panelId).classList.add('active');
}

function renderRestored(item) {
  if (item.type === 'daily') {
    const result = document.createElement('div');
    let meta = `题型 <b>${escapeHtml(item.form || '')}</b>`;
    if (item.duration_s) meta += ` · 时长 <b>${item.duration_s}s</b>`;
    meta += ' · 恢复于历史';
    result.innerHTML = `<div class="meta">${meta}</div>`;
    // 听力音频同步恢复
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.style.width = '100%';
    audio.style.marginBottom = '12px';
    audio.src = `/api/daily/audio?date=${item.date}` + (item.audio_dir ? `&dir=${encodeURIComponent(item.audio_dir)}` : '');
    const errEl = document.createElement('div');
    errEl.className = 'audio-error';
    errEl.style.display = 'none';
    audio.onerror = () => { errEl.textContent = '音频加载失败：wav 文件未找到。'; errEl.style.display = 'block'; };
    result.appendChild(audio);
    result.appendChild(errEl);
    const unitsBox = document.createElement('div');
    unitsBox.className = 'daily-units';
    const unitRows = [];
    (item.units || []).forEach(u => {
      const row = makeSentenceRow(u.text, u.speaker === 'N' ? null : u.speaker, true, '每日一篇');
      unitRows.push(row);
      unitsBox.appendChild(row);
    });
    result.appendChild(unitsBox);
    // 逐词高亮：优先词级时间戳，缺省按比例估算
    const timeline = item.timeline || [];
    const wordTimeline = item.word_timeline || [];
    const wordSpansPerRow = collectDailyWordSpans(unitRows);
    audio.ontimeupdate = () => {
      highlightDailyWords(unitRows, wordSpansPerRow, timeline, wordTimeline, audio.currentTime, audio.duration);
    };
    audio.onended = () => { wordSpansPerRow.flat().forEach(s => s.classList.remove('read')); };
    $('daily-result').innerHTML = '';
    $('daily-result').appendChild(result);
    $('daily-status').textContent = '已从历史恢复'; 
  } else if (item.type === 'story') {
    const area = $('story-area');
    area.innerHTML = '';
    (item.segments || []).forEach((seg, i) => {
      const p = document.createElement('div');
      p.className = 'sent-row';
      p.style.opacity = 1;
      p.textContent = seg;
      area.appendChild(p);
      if (i < (item.choices || []).length) {
        const c = document.createElement('div');
        c.className = 'meta';
        c.textContent = `→ 选择：${item.choices[i]}`;
        area.appendChild(c);
      }
    });
    $('story-status').textContent = '已从历史恢复（此段已存档，不可继续推进）';
  } else if (item.type === 'writing') {
    // 用面板自身逻辑恢复：同步闭包 task、启用提交按钮（旧实现只填 DOM，导致提交时带着旧 task）
    const task = Object.assign({}, item.task || {}, { _history_id: item.id });
    wrPanel.renderTask(task);
    wrPanel.setAnswer(item.answer || '');
    const g = item.grade || {};
    if (g.score !== undefined) {
      wrPanel.renderGrade(Object.assign({ type: 'writing' }, g));
    }
  } else if (item.type === 'translation') {
    // 整段模式
    trTask = Object.assign({}, item.task || {}, { _history_id: item.id });
    trRenderTask(trTask);
    $('tr-input').value = item.answer || '';
    const g = item.grade || {};
    if (g.score !== undefined) {
      trRenderWholeGrade(g);
    } else {
      $('tr-grade').innerHTML = '';
    }
    // 单句模式：渲染并回填每句的译文与批改
    trRenderSentences();
    const sgs = item.sentence_grades || {};
    Object.keys(sgs).forEach(k => {
      const idx = parseInt(k, 10);
      const row = document.querySelector('.tr-sent[data-index="' + idx + '"]');
      if (!row || !sgs[k]) return;
      row.querySelector('.tr-sent-input').value = sgs[k].answer || '';
      const gr = sgs[k].grade || {};
      row.querySelector('.tr-s-result').innerHTML =
        '<div class="grade-block"><span class="grade-score">' + (gr.score !== undefined ? gr.score : '') +
        '</span><span class="grade-tag">/15 · ' + escapeHtml(gr.tier || '') + '</span></div>' +
        '<div class="grade-block"><div class="grade-label">参考译文</div><div class="model-block">' + escapeHtml(gr.reference || '') + '</div></div>' +
        '<div class="grade-block"><div class="grade-label">点评</div><div class="grade-para">' + escapeHtml(gr.comment || '') + '</div></div>';
    });
  } else if (item.type === 'speaking') {
    spExerciseId = item.id || null;
    spSentences = item.sentences || [];
    spTargetSet = new Set((item.target_words || []).map(w => String(w).toLowerCase()));
    $('sp-words-meta').textContent = (item.target_words && item.target_words.length)
      ? '织入六级词 ' + item.target_words.length + ' 个：' + item.target_words.join('、') : '';
    spRenderSentences();
    const scores = item.sentence_scores || {};
    Object.keys(scores).forEach(k => {
      const idx = parseInt(k, 10);
      if (!isNaN(idx)) spRenderSentenceScore(idx, scores[k]);
    });
    $('sp-task').style.display = 'block';
    $('sp-status').textContent = '已从历史恢复';
  }
}

// 历史按钮事件
document.querySelectorAll('.hist-btn').forEach(b => {
  b.onclick = () => openHistory(b.dataset.type);
});
</script>
